<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Q2 - Grade Calculator</title></head>
<body>
<h2>Student Grade</h2>
Enter marks (0-100): <input type="number" id="marks">
<button onclick="showGrade()">Get Grade</button>
<h3 id="res"></h3>
<script>
// Returns grade according to the given criteria (if-else ladder)
function getGrade(m) {
  if (m >= 90) return "A+";
  else if (m >= 80) return "A";
  else if (m >= 70) return "B";
  else if (m >= 60) return "C";
  else return "Fail";
}
function showGrade() {
  var m = parseFloat(document.getElementById("marks").value);
  var res = document.getElementById("res");
  if (isNaN(m) || m < 0 || m > 100) { res.innerHTML = "Enter valid marks between 0 and 100."; return; }
  res.innerHTML = "Marks: " + m + " &rarr; Grade: " + getGrade(m);
}
</script></body></html>
