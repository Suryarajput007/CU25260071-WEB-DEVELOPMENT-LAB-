<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Q1 - Arithmetic Operations</title></head>
<body>
<h2>Arithmetic Operations</h2>
Number 1: <input type="number" id="a"><br><br>
Number 2: <input type="number" id="b"><br><br>
<button onclick="compute()">Calculate</button>
<div id="out"></div>
<script>
// Performs all four operations on the two numbers
function compute() {
  var a = Number(document.getElementById("a").value);
  var b = Number(document.getElementById("b").value);
  var html = "Addition: " + (a + b) + "<br>" +
             "Subtraction: " + (a - b) + "<br>" +
             "Multiplication: " + (a * b) + "<br>" +
             "Division: " + (b === 0 ? "Not possible (divide by zero)" : (a / b));
  document.getElementById("out").innerHTML = html;
}
</script></body></html>
