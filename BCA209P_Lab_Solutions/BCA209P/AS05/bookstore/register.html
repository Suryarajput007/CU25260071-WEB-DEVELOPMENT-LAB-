<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - BookWorld</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><a class="logo" href="index.html"><img src="images/logo.svg" width="40" alt="logo">BookWorld</a>
<nav><a href="index.html">Home</a><a href="catalogue.html">Catalogue</a><a href="register.html">Register</a><a href="login.html">Login</a>
<a href="cart.html">Cart (<span id="cartCount">0</span>)</a><a href="contact.html">Contact Us</a></nav></header>
<main>
<div class="formbox"><h2>User Registration</h2>
<form id="regForm" onsubmit="return validateRegister()">
<label>Full Name</label><input type="text" name="fname">
<label>Email</label><input type="email" name="email">
<label>Mobile</label><input type="text" name="mobile">
<label>Password</label><input type="password" name="pass">
<label>Confirm Password</label><input type="password" name="cpass">
<label>Gender</label><div class="inl"><input type="radio" name="g" checked><label>Male</label><input type="radio" name="g"><label>Female</label></div>
<label>Favourite Category</label><select name="cat"><option>Programming</option><option>Web</option><option>Database</option><option>Computer Science</option></select>
<label>Interests</label><div class="inl"><input type="checkbox"><label>New arrivals</label><input type="checkbox"><label>Discounts</label></div>
<label>Address</label><textarea name="addr" rows="3"></textarea>
<div class="inl"><input type="checkbox" name="terms"><label>I accept the terms and conditions</label></div>
<input type="submit" value="Register"><input type="reset" value="Reset"></form></div>
</main>
<footer>&copy; 2026 BookWorld Online Book Store</footer>
<script src="js/books.js"></script><script src="js/main.js"></script>
</body></html>
