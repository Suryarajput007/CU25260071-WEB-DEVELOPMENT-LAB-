<!DOCTYPE html>
<html>
<head><title>Q2 - College Website using Frames</title></head>
<!-- NOTE: <frameset> is obsolete in HTML5 but still works in most browsers; if it does not render, use q2_frames_modern.html -->
<frameset rows="20%,80%">
  <frame src="pages/header.html" name="header" noresize>
  <frameset cols="20%,80%">
    <frame src="pages/menu.html" name="menu">
    <frame src="pages/home.html" name="main">
  </frameset>
</frameset>
</html>
