<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Q2 - Text Formatting Tags</title></head>
<body>
  <h1>Heading 1</h1><h2>Heading 2</h2><h3>Heading 3</h3>
  <h4>Heading 4</h4><h5>Heading 5</h5><h6>Heading 6</h6>
  <p><b>Bold text</b> | <strong>Strong text (important)</strong></p>
  <p><i>Italic text</i> | <em>Emphasized text</em></p>
  <p><u>Underlined text</u> | <mark>Highlighted (mark) text</mark></p>
  <p>Superscript: x<sup>2</sup> + y<sup>2</sup> = z<sup>2</sup></p>
  <p>Subscript: H<sub>2</sub>O and CO<sub>2</sub></p>
</body>
</html>
