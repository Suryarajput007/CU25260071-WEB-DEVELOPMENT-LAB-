<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Q9 - Student Registration Form</title></head>
<body>
  <h2>Student Registration Form</h2>
  <form action="#" method="post">
    Name: <input type="text" name="name" required><br><br>
    Email: <input type="email" name="email" required><br><br>
    Password: <input type="password" name="password" required><br><br>
    Gender:
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other<br><br>
    Date of Birth: <input type="date" name="dob"><br><br>
    Course:
    <select name="course">
      <option>BCA</option><option>BBA</option><option>B.Com</option><option>B.Sc</option>
    </select><br><br>
    Hobbies:
    <input type="checkbox" name="hobby" value="Reading"> Reading
    <input type="checkbox" name="hobby" value="Music"> Music
    <input type="checkbox" name="hobby" value="Sports"> Sports<br><br>
    Address:<br><textarea name="address" rows="4" cols="35"></textarea><br><br>
    <input type="submit" value="Submit"> <input type="reset" value="Reset">
  </form>
</body>
</html>
